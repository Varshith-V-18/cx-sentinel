# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub, then in Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and provisions both services automatically.

services:
  - type: web
    name: cx-sentinel
    runtime: docker
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in the Render dashboard (secret)
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        fromDatabase:
          name: cx-sentinel-db
          property: connectionString
      - key: CHROMA_DIR
        value: /app/chroma_store

databases:
  - name: cx-sentinel-db
    plan: free
    databaseName: cx_sentinel
    user: cx_sentinel
